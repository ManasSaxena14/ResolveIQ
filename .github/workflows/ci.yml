name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # CPU-only builds keep the install small; versions match requirements.txt.
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.23.0
          # xgboost-cpu is the same library without the CUDA dependencies.
          pip install xgboost-cpu==3.4.1
          pip install -e . --no-deps

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov=resolveiq --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  lite:
    # Installs only requirements-lite.txt, as the Render build does, and checks that
    # the lite runtime imports and passes its tests without PyTorch or ChromaDB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lite.txt

      - name: Install the lite dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt
          pip install -e . --no-deps
          pip install pytest==9.2.0

      - name: Import the service without heavy libraries
        env:
          RESOLVEIQ_RUNTIME: lite
        run: |
          python -c "import sys, resolveiq.api.main, resolveiq.lite; heavy = [m for m in ('torch', 'transformers', 'chromadb', 'sentence_transformers') if m in sys.modules]; assert not heavy, heavy; print('lite imports ok')"

      - name: Test the lite runtime
        run: pytest tests/test_lite.py tests/test_limits.py -q
