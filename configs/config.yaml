# ResolveIQ configuration.
# Values are starting points. Replace each one with the value your own
# measurements justify and record the reason in docs/rag_pipeline.md.

project:
  name: ResolveIQ
  company_name: Altura

rag:
  # bge-small supports 512 tokens per input, so 500-token chunks are embedded
  # without truncation (all-MiniLM-L6-v2 stops at 256).
  embedding_model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  collection: altura_kb
  chunk_tokens: 500
  chunk_overlap: 50
  top_k: 5
  candidate_k: 20          # pool size for hybrid fusion and reranking
  hybrid: true
  rerank: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Chosen from the dev-split histogram of best similarity scores. bge scores sit
  # in a compressed high range, so the generic 0.35 starting value never refused.
  refusal_threshold: 0.62
  rrf_k: 60

llm:
  provider: ollama         # ollama | gemini | groq | openrouter
  temperature: 0.1
  max_tokens: 512
  timeout_seconds: 60
  # Hosted model names change often. Check the provider documentation before
  # switching and update the model name here, not in code.
  providers:
    ollama:
      model: llama3.2
      base_url: http://localhost:11434
    gemini:
      model: gemini-2.5-flash
      base_url: https://generativelanguage.googleapis.com/v1beta
      api_key_env: GEMINI_API_KEY
    groq:
      model: llama-3.1-8b-instant
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
    openrouter:
      model: meta-llama/llama-3.2-3b-instruct:free
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY

classifier:
  dataset:
    repo_id: Tobi-Bueck/customer-support-tickets
    revision: ddf1c81a5475992c4fa6752bf1e8b4e31f07bbeb   # pinned for reproducibility
    filename: aa_dataset-tickets-multi-lang-5-2-50-version.csv
    raw_path: data/raw/customer_support_tickets.csv
    language: en
    label_column: queue
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    seed: 42
  processed_dir: data/processed
  model_name: distilbert-base-uncased
  max_length: 256          # set from the token length histogram of subject + body
  learning_rate: 5.0e-5
  batch_size: 16
  epochs: 5                # the queue task converges slowly; early stopping picks the epoch
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_weights: true      # weighted loss, because queue sizes are imbalanced
  seeds: [42, 7, 1234]
  review_threshold: 0.70   # replaced by the calibrated value from the validation set
  output_dir: models/classifier

risk:
  # Proxy label: the dataset has no escalation field, so a ticket marked high
  # priority counts as an escalation. The priority column is therefore never a feature.
  label:
    source_column: priority
    positive_values: [high]
  output_dir: models/risk
  features_dir: data/processed/risk
  queue_folds: 5           # out-of-fold text model scores for the training split
  # Adds the score of a TF-IDF model trained on the label. Set to false to measure
  # the model on hand-built features only (see docs/risk_model.md).
  text_score_feature: true
  seed: 42
  xgboost:
    n_estimators: 1000     # upper bound; early stopping on validation picks the count
    learning_rate: 0.05
    max_depth: 5
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
  tuning_grid:
    max_depth: [4, 5, 6]
    min_child_weight: [1, 5]
    colsample_bytree: [0.6, 0.8, 1.0]
  calibration: sigmoid     # isotonic | sigmoid, fitted on the validation split
  precision_target: 0.70   # for the "recall at fixed precision" metric
  # Cost of missing an escalation relative to a false alarm (cost 1). The alert
  # threshold minimizes total cost on validation for alert_cost_ratio. With 39% of
  # tickets labeled high priority, ratios of 10:1 and above alert on most tickets,
  # so 3:1 is used (see the cost table in docs/risk_model.md).
  cost_ratios: [1, 2, 3, 5, 10, 20]
  alert_cost_ratio: 3

paths:
  kb_dir: data/kb
  index_dir: .chroma
  results_dir: results

tracking:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
