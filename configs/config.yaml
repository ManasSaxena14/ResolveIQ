# ResolveIQ configuration.
# Values are starting points. Replace each one with the value your own
# measurements justify and record the reason in docs/rag_pipeline.md.

project:
  name: ResolveIQ
  company_name: Altura

rag:
  # bge-small supports 512 tokens per input, so 500-token chunks are embedded
  # without truncation (all-MiniLM-L6-v2 stops at 256).
  embedding_model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  collection: altura_kb
  chunk_tokens: 500
  chunk_overlap: 50
  top_k: 5
  candidate_k: 20          # pool size for hybrid fusion and reranking
  hybrid: true
  rerank: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Chosen from the dev-split histogram of best similarity scores. bge scores sit
  # in a compressed high range, so the generic 0.35 starting value never refused.
  refusal_threshold: 0.62
  rrf_k: 60

llm:
  provider: ollama         # ollama | gemini | groq | openrouter
  # Only free models: Ollama runs locally; Groq and Gemini are used on their free
  # tiers (create the key on an account without billing); OpenRouter models must be
  # one of its ":free" variants, which the config check enforces while this is true.
  free_only: true
  temperature: 0.1
  max_tokens: 512
  timeout_seconds: 60
  # Hosted model names change often. Check the provider documentation before
  # switching and update the model name here, not in code.
  providers:
    ollama:
      model: llama3.2
      base_url: http://localhost:11434
    gemini:
      model: gemini-2.5-flash
      base_url: https://generativelanguage.googleapis.com/v1beta
      api_key_env: GEMINI_API_KEY
    groq:
      model: llama-3.1-8b-instant
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
    openrouter:
      model: meta-llama/llama-3.2-3b-instruct:free
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY

classifier:
  dataset:
    repo_id: Tobi-Bueck/customer-support-tickets
    revision: ddf1c81a5475992c4fa6752bf1e8b4e31f07bbeb   # pinned for reproducibility
    filename: aa_dataset-tickets-multi-lang-5-2-50-version.csv
    raw_path: data/raw/customer_support_tickets.csv
    language: en
    label_column: queue
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    seed: 42
  processed_dir: data/processed
  model_name: distilbert-base-uncased
  max_length: 256          # set from the token length histogram of subject + body
  learning_rate: 5.0e-5
  batch_size: 16
  epochs: 5                # the queue task converges slowly; early stopping picks the epoch
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_weights: true      # weighted loss, because queue sizes are imbalanced
  seeds: [42, 7, 1234]
  review_threshold: 0.70   # replaced by the calibrated value from the validation set
  output_dir: models/classifier

risk:
  # Proxy label: the dataset has no escalation field, so a ticket marked high
  # priority counts as an escalation. The priority column is therefore never a feature.
  label:
    source_column: priority
    positive_values: [high]
  output_dir: models/risk
  features_dir: data/processed/risk
  queue_folds: 5           # out-of-fold text model scores for the training split
  # Adds the score of a TF-IDF model trained on the label. Set to false to measure
  # the model on hand-built features only (see docs/risk_model.md).
  text_score_feature: true
  seed: 42
  xgboost:
    n_estimators: 1000     # upper bound; early stopping on validation picks the count
    learning_rate: 0.05
    max_depth: 5
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    early_stopping_rounds: 50
  tuning_grid:
    max_depth: [4, 5, 6]
    min_child_weight: [1, 5]
    colsample_bytree: [0.6, 0.8, 1.0]
  calibration: sigmoid     # isotonic | sigmoid, fitted on the validation split
  precision_target: 0.70   # for the "recall at fixed precision" metric
  # Cost of missing an escalation relative to a false alarm (cost 1). The alert
  # threshold minimizes total cost on validation for alert_cost_ratio. With 39% of
  # tickets labeled high priority, ratios of 10:1 and above alert on most tickets,
  # so 3:1 is used (see the cost table in docs/risk_model.md).
  cost_ratios: [1, 2, 3, 5, 10, 20]
  alert_cost_ratio: 3

service:
  # Limits protect the public demo. Longer tickets are rejected with HTTP 422.
  max_text_chars: 4000
  max_upload_bytes: 2000000      # 2 MB, larger batch files return HTTP 413
  max_batch_rows: 2000
  # registry: load the "production" alias from the MLflow model registry and fall
  # back to the local folders below when the registry is unavailable (as on a
  # hosted demo). local: always use the folders.
  model_source: registry
  # full: PyTorch, sentence-transformers and ChromaDB (about 760 MB of memory).
  # lite: the same models as 8-bit ONNX graphs with a NumPy index, for small free
  # hosts (under 512 MB, starts in seconds). Build it with scripts/export_lite.py.
  # RESOLVEIQ_RUNTIME overrides this setting.
  runtime: full
  lite_dir: models/lite
  classifier_dir: models/classifier/production
  risk_dir: models/risk
  registry:
    classifier_name: resolveiq-ticket-classifier
    risk_name: resolveiq-escalation-risk
    alias: production
    cache_dir: models/registry
  request_log: logs/requests.db
  # Requests per minute on the API routes. Callers with a key from the
  # RESOLVEIQ_API_KEYS environment variable get the higher limit.
  rate_limit:
    enabled: true
    anonymous_per_minute: 30
    key_per_minute: 300
    # Read the client address from X-Forwarded-For. Only enable behind a proxy that
    # sets it (such as Render or Caddy on Oracle Cloud); otherwise clients could spoof it.
    trust_forwarded_for: false
  # Knowledge base files are linked from the UI so a reader can open the source.
  source_base_url: https://github.com/ManasSaxena14/ResolveIQ/blob/main/data/kb/

monitoring:
  reference_path: results/monitoring/reference.csv
  report_dir: results/monitoring
  recent_requests: 500           # rows from the request log compared with the reference
  numeric_features: [text_length, confidence, risk_score]
  categorical_features: [category]
  psi_threshold: 0.2             # a feature drifts when PSI is at least this value
  p_value: 0.05                  # and its KS or chi-square test is significant
  # Retrain rule (see docs/monitoring.md).
  retrain_drift_share: 0.5       # share of monitored features that drifted
  retrain_thumbs_down_rate: 0.3  # share of negative feedback
  min_feedback: 20               # feedback rule applies only after this many votes

paths:
  kb_dir: data/kb
  index_dir: .chroma
  results_dir: results

tracking:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
